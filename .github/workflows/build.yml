name: Build iOS 27 Dark Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies (Cairo & Pillow)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config python3-dev
          pip install pycairo pillow

      - name: Generate iOS 27 Dark Icons & Honor .hnt/.hwt
        run: |
          python3 icons_generator/build_icons.py
          python3 icons_generator/build_honor_hnt.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build iOS 27 Widgets APK
        working-directory: widgets-app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build iOS 27 Dark IconPack APK
        working-directory: iconpack-apk
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Collect output artifacts
        run: |
          mkdir -p output
          cp widgets-app/app/build/outputs/apk/debug/app-debug.apk output/iOS27_Widgets.apk
          cp iconpack-apk/app/build/outputs/apk/debug/app-debug.apk output/iOS27_Dark_IconPack.apk
          ls -lh output/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios27-dark-suite-artifacts
          path: |
            output/iOS27_Dark_MagicOS.hnt
            output/iOS27_Dark_MagicOS.hwt
            output/iOS27_Widgets.apk
            output/iOS27_Dark_IconPack.apk
